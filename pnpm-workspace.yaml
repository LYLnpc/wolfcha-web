packages:
  - .

# 这些依赖的原生构建脚本本项目用不到，显式声明为 false：
#   sharp                          -> next.config.ts 已设 images.unoptimized，不走图片优化
#   @swc/core                      -> 只用 wasm 回退
#   @parcel/watcher, unrs-resolver -> 文件监听 / eslint 解析器
# 必须显式声明：pnpm 11 遇到未声明的构建脚本会以 ERR_PNPM_IGNORED_BUILDS 退出，CI 会失败。
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: false
  unrs-resolver: false
