name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-gh-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # package.json 的 packageManager 声明的是 yarn，关闭 pnpm 的严格版本校验
      COREPACK_ENABLE_STRICT: "0"
      npm_config_manage_package_manager_versions: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 必须用 pnpm：pnpm-lock.yaml 记录了全平台原生二进制，
      # 而 Windows 生成的 package-lock.json 只含 win32 包，Linux runner 上
      # 会缺 lightningcss.linux-x64-gnu.node 导致 CSS 编译失败。
      # 上游 lock 与 package.json 的 specifiers 不一致，因此不能用 --frozen-lockfile。
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static export
        env:
          # 仓库名即 Pages 子路径；改仓库名时这里会自动跟着变
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      # Pages 是 legacy 模式，从 gh-pages 分支根目录托管
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
